version: "3.8"
services:
  media_container:
    container_name: media_container
    build: ./
    # command: ./media_service "migrate"
    volumes:
      - ./uploads:/media/uploads # чтобы файлы сохранялись на компе
    environment:
      # - POSTGRES_HOST=go_shop_postgres
      # - POSTGRES_USER=${POSTGRES_USER}
      # - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      # - POSTGRES_DB=${POSTGRES_DB}
      # - POSTGRES_PORT=5432
      - KAFKA_BROKER=kafka:9092
    networks:
      - shopongo_default
    ports:
      - "8084:8084"

  test:
    image: golang:1.23
    container_name: shop_on_go_test
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env
    command: go test ./...
    networks:
      - shopongo_default


networks:
  shopongo_default:
